name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Configure game asset host
        env:
          AGU_GAME_BASE_URL: ${{ vars.AGU_GAME_BASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os
          url = os.environ.get("AGU_GAME_BASE_URL", "").strip()
          with open("game-host-config.js", "w", encoding="utf-8") as config:
              config.write("window.AGU_GAME_BASE_URL = " + json.dumps(url) + ";\n")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
