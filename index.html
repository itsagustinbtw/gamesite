<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGU Games</title>
    <style>
        :root {
            --bg: #121212;
            --fg: #ffffff;
            --line: #212121;
            --panel: #ff5900;
            --card: #ff5900;
            --bg-blur: 1.5px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.4;
        }

        body {
            position: relative;
            min-height: 100vh;
            background: var(--bg);
        }

        #siteBackgroundLayer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            pointer-events: none;
            filter: blur(var(--bg-blur)) brightness(0.8);
            transition: opacity 0.18s ease;
        }

        body > *:not(#siteBackgroundLayer):not(#zoneViewer) {
            position: relative;
            z-index: 1;
        }

        body.halloween {
            background-color: #0d0908;
            color: #f5efe7;
        }

        body.halloween .zone-item img {
            filter: saturate(1.15) contrast(1.05);
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .main-nav a {
            color: var(--fg);
            text-decoration: none;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        header {
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .palette-bar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 12px 0;
            display: flex;
            justify-content: flex-end;
        }

        .logo {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            white-space: nowrap;
            text-transform: uppercase;
            opacity: 0.95;
        }

        .search-container {
            display: flex;
            flex: 1;
            gap: 8px;
            max-width: 760px;
        }

        .customizer {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 4px;
            flex-wrap: wrap;
        }

        .customizer label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.9;
        }

        .customizer input[type="color"] {
            width: 22px;
            height: 22px;
            border: 1px solid var(--line);
            background: transparent;
            padding: 0;
            cursor: pointer;
        }

        .site-settings {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 12px 0;
            max-width: 1200px;
            margin: 0 auto;
        }

        .blur-control {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--fg);
        }

        .blur-control.hidden,
        #disableThemeButton.hidden {
            display: none;
        }

        .blur-control input[type="range"] {
            width: 120px;
            min-width: 120px;
            margin: 0;
            padding: 0;
            accent-color: var(--panel);
            cursor: pointer;
        }

        #disableThemeButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .site-settings input {
            min-height: 32px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--fg);
            padding: 6px 8px;
            border-radius: 0;
            outline: none;
        }

        .site-settings input[type="text"] {
            min-width: 180px;
        }

        .site-settings button {
            min-height: 32px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--fg);
            padding: 6px 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select, button {
            font: inherit;
        }

        #searchBar, #sortOptions, #filterOptions {
            width: 100%;
            min-height: 36px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--fg);
            padding: 7px 9px;
            border-radius: 0;
            outline: none;
        }

        #searchBar {
            flex: 1;
        }

        #sortOptions, #filterOptions {
            max-width: 180px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 14px 28px;
        }

        details {
            margin-bottom: 18px;
        }

        summary {
            list-style: none;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--fg);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.96;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        #container, #featuredZones {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
        }

        .zone-item {
            border: 1px solid var(--line);
            background: var(--card);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            min-height: 220px;
            transition: transform 0.18s ease, filter 0.18s ease, border-color 0.18s ease;
            user-select: none;
        }

        .zone-item:hover {
            transform: scale(1.02);
            filter: brightness(1.02);
        }

        .zone-item img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .zone-item.missing {
            background: #080808;
        }

        .zone-item.missing img {
            display: none;
        }

        .zone-item button {
            width: 100%;
            border: 0;
            background: transparent;
            color: var(--fg);
            padding: 9px 8px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            text-transform: none;
            opacity: 0.98;
        }

        body.zone-open {
            overflow: hidden;
        }

        #zoneViewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            z-index: 20;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .zone-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            padding: 7px 12px;
            background: var(--panel);
        }

        #zoneName {
            margin: 0;
            font-size: 1rem;
            color: var(--fg);
            text-transform: uppercase;
        }

        #zoneId {
            display: none;
        }

        .zone-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .zone-controls button {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--fg);
            padding: 7px 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            opacity: 0.94;
        }

        #zoneFrame {
            width: 100%;
            height: 100%;
            border: 0;
            background: var(--bg);
        }

        @media (max-width: 720px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .search-container {
                flex-wrap: wrap;
            }

            #sortOptions, #filterOptions {
                max-width: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">AGU Games</div>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="news.html">News</a>
            </nav>
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search games..." aria-label="Search games">
                <select id="sortOptions" aria-label="Sort games">
                    <option value="name">Name</option>
                    <option value="id">ID</option>
                    <option value="popular">Popular</option>
                    <option value="trendingDay">Trending Day</option>
                    <option value="trendingWeek">Trending Week</option>
                    <option value="trendingMonth">Trending Month</option>
                </select>
                <select id="filterOptions" aria-label="Filter games">
                    <option value="none">All tags</option>
                </select>
            </div>
        </div>
    </header>

    <div class="palette-bar">
        <div class="customizer" aria-label="Customize colors">
            <label>BG <input id="bgColor" type="color" value="#121212" aria-label="Background color"></label>
            <label>TXT <input id="fgColor" type="color" value="#ffffff" aria-label="Text color"></label>
            <label>LINE <input id="lineColor" type="color" value="#212121" aria-label="Line color"></label>
            <label>PANEL <input id="panelColor" type="color" value="#ff5900" aria-label="Panel color"></label>
        </div>
    </div>

    <div id="siteBackgroundLayer" aria-hidden="true"></div>

    <div class="site-settings">
        <label>
            <span>Title</span>
            <input id="siteTitleInput" type="text" value="AGU Games" aria-label="Site title">
        </label>
        <label>
            <span>Favicon</span>
            <input id="faviconInput" type="text" value="" placeholder="https://example.com/favicon.png" aria-label="Favicon URL">
        </label>
        <label>
            <span>BG Image</span>
            <input id="bgImageInput" type="file" accept="image/*" aria-label="Custom background image">
        </label>
        <label class="blur-control">
            <span>Blur</span>
            <input id="bgBlurInput" type="range" min="0" max="8" step="0.5" value="1.5" aria-label="Background blur amount">
        </label>
        <button id="disableThemeButton" type="button">Disable Theme</button>
    </div>

    <main>
        <details id="allZonesWrapper" open>
            <summary>All Games</summary>
            <div id="container">Loading...</div>
        </details>
    </main>

    <div id="zoneViewer">
        <div class="zone-header">
            <div class="zone-title">
                <h2 id="zoneName">Game</h2>
                <span id="zoneId"></span>
            </div>
            <div class="zone-controls">
                <button type="button" onclick="fullscreenZone()">Full</button>
                <button type="button" onclick="aboutBlank()">New Tab</button>
                <button type="button" onclick="downloadZone()">Download</button>
                <button type="button" onclick="closeZone()">Close</button>
            </div>
        </div>
        <iframe id="zoneFrame" allowfullscreen="true" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script>
        const container = document.getElementById('container');
        const featuredContainer = document.getElementById('featuredZones');
        const featuredZonesWrapper = document.getElementById('featuredZonesWrapper');
        const zoneViewer = document.getElementById('zoneViewer');
        const searchBar = document.getElementById('searchBar');
        const sortOptions = document.getElementById('sortOptions');
        const filterOptions = document.getElementById('filterOptions');
        const bgColor = document.getElementById('bgColor');
        const fgColor = document.getElementById('fgColor');
        const lineColor = document.getElementById('lineColor');
        const panelColor = document.getElementById('panelColor');
        const siteTitleInput = document.getElementById('siteTitleInput');
        const faviconInput = document.getElementById('faviconInput');
        const bgImageInput = document.getElementById('bgImageInput');
        const bgBlurInput = document.getElementById('bgBlurInput');
        const disableThemeButton = document.getElementById('disableThemeButton');
        const siteBackgroundLayer = document.getElementById('siteBackgroundLayer');
        let zoneFrame = document.getElementById('zoneFrame');
        const INITIAL_VISIBLE_GAMES = 120;
        const DEFAULT_HALLOWEEN_BG = 'grunge-halloween-background-with-evil-pumpkins-scary-ghost_1048-12867.avif';
        const FALLBACK_IMAGE = 'agus4.png';
        let renderList = [];
        let visibleCount = INITIAL_VISIBLE_GAMES;

        const defaultPalette = {
            bg: '#121212',
            fg: '#ffffff',
            line: '#212121',
            panel: '#ff5900',
            card: '#ff5900'
        };

        const halloweenPalette = {
            bg: '#110b0a',
            fg: '#f8f1d0',
            line: '#4a2c1d',
            panel: '#ff7a1a',
            card: '#ff7a1a'
        };

        function applyPalette(palette) {
            const root = document.documentElement;
            const values = {
                '--bg': palette.bg || defaultPalette.bg,
                '--fg': palette.fg || defaultPalette.fg,
                '--line': palette.line || defaultPalette.line,
                '--panel': palette.panel || palette.bg || defaultPalette.panel,
                '--card': palette.card || palette.panel || palette.bg || defaultPalette.card
            };

            Object.entries(values).forEach(([key, value]) => {
                root.style.setProperty(key, value);
            });

            if (!document.body.classList.contains('halloween')) {
                document.body.style.background = values['--bg'];
                localStorage.setItem('gamesitePalette', JSON.stringify(values));
            } else {
                document.body.style.background = '';
            }
        }

        function loadPalette() {
            try {
                const stored = JSON.parse(localStorage.getItem('gamesitePalette') || '{}');
                const hasStaleHalloweenPalette = stored['--bg'] === halloweenPalette.bg &&
                    stored['--fg'] === halloweenPalette.fg &&
                    stored['--line'] === halloweenPalette.line &&
                    stored['--panel'] === halloweenPalette.panel;

                if (hasStaleHalloweenPalette) {
                    localStorage.setItem('gamesitePalette', JSON.stringify({
                        '--bg': defaultPalette.bg,
                        '--fg': defaultPalette.fg,
                        '--line': defaultPalette.line,
                        '--panel': defaultPalette.panel,
                        '--card': defaultPalette.card
                    }));
                }

                const palette = {
                    bg: stored['--bg'] || defaultPalette.bg,
                    fg: stored['--fg'] || defaultPalette.fg,
                    line: stored['--line'] || defaultPalette.line,
                    panel: stored['--panel'] || defaultPalette.panel,
                    card: stored['--card'] || stored['--panel'] || defaultPalette.card
                };

                bgColor.value = palette.bg;
                fgColor.value = palette.fg;
                lineColor.value = palette.line;
                panelColor.value = palette.panel;
                applyPalette(palette);
            } catch (error) {
                applyPalette(defaultPalette);
            }
        }

        function bindPaletteInputs() {
            [bgColor, fgColor, lineColor, panelColor].forEach(input => {
                input.addEventListener('input', () => {
                    applyPalette({
                        bg: bgColor.value,
                        fg: fgColor.value,
                        line: lineColor.value,
                        panel: panelColor.value,
                        card: panelColor.value
                    });
                });
            });
        }

        function applyBackgroundBlur(valueOverride) {
            const rawValue = Number.parseFloat(valueOverride ?? localStorage.getItem('aguGamesBgBlur') ?? '1.5');
            const safeValue = Number.isFinite(rawValue) ? rawValue : 1.5;
            const clampedValue = Math.min(8, Math.max(0, safeValue));
            const root = document.documentElement;
            root.style.setProperty('--bg-blur', `${clampedValue}px`);
            if (bgBlurInput) {
                bgBlurInput.value = String(clampedValue);
            }
            localStorage.setItem('aguGamesBgBlur', String(clampedValue));
            return clampedValue;
        }

        function applyBackgroundImage(url) {
            const trimmed = String(url || '').trim();
            const safeUrl = trimmed || '';
            const customBg = localStorage.getItem('aguGamesCustomBg') || '';
            const halloweenOn = document.body.classList.contains('halloween');
            const activeUrl = halloweenOn ? (customBg || DEFAULT_HALLOWEEN_BG) : (safeUrl || customBg || '');

            if (siteBackgroundLayer) {
                if (activeUrl) {
                    siteBackgroundLayer.style.backgroundImage = `url("${activeUrl}")`;
                    siteBackgroundLayer.style.opacity = '1';
                    siteBackgroundLayer.style.display = 'block';
                } else {
                    siteBackgroundLayer.style.backgroundImage = 'none';
                    siteBackgroundLayer.style.opacity = '0';
                    siteBackgroundLayer.style.display = 'none';
                }
            }

            if (!halloweenOn && !safeUrl && !customBg) {
                document.body.style.background = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#121212';
            }
        }

        function updateDisableThemeButton() {
            if (!disableThemeButton) return;
            const halloweenOn = document.body.classList.contains('halloween');
            const customBgSet = !!String(localStorage.getItem('aguGamesCustomBg') || '').trim();
            const hasActiveImage = halloweenOn || customBgSet;
            disableThemeButton.classList.toggle('hidden', !hasActiveImage);
            disableThemeButton.disabled = !hasActiveImage;
            disableThemeButton.textContent = halloweenOn ? 'Disable Halloween' : customBgSet ? 'Disable Background' : 'No Image Theme';

            if (bgBlurInput) {
                bgBlurInput.parentElement.classList.toggle('hidden', !hasActiveImage);
            }
        }

        function disableImageTheme() {
            const halloweenOn = document.body.classList.contains('halloween');
            const customBgSet = !!String(localStorage.getItem('aguGamesCustomBg') || '').trim();

            if (halloweenOn) {
                localStorage.setItem('aguGamesHalloween', JSON.stringify(false));
                applyHalloweenTheme(false);
                return;
            }

            if (customBgSet) {
                localStorage.removeItem('aguGamesCustomBg');
                applyBackgroundImage('');
            }
            updateDisableThemeButton();
        }

        function applyHalloweenTheme(enabled) {
            document.body.classList.toggle('halloween', enabled);

            const stored = JSON.parse(localStorage.getItem('gamesitePalette') || '{}');
            const currentPalette = {
                bg: stored['--bg'] || defaultPalette.bg,
                fg: stored['--fg'] || defaultPalette.fg,
                line: stored['--line'] || defaultPalette.line,
                panel: stored['--panel'] || defaultPalette.panel,
                card: stored['--card'] || stored['--panel'] || defaultPalette.card
            };

            if (!enabled) {
                bgColor.value = currentPalette.bg;
                fgColor.value = currentPalette.fg;
                lineColor.value = currentPalette.line;
                panelColor.value = currentPalette.panel;
                applyPalette(currentPalette);
            }

            const customBg = localStorage.getItem('aguGamesCustomBg');
            if (enabled) {
                applyBackgroundImage(customBg || DEFAULT_HALLOWEEN_BG);
            } else {
                applyBackgroundImage(customBg || '');
            }
            localStorage.setItem('aguGamesHalloween', JSON.stringify(enabled));
            updateDisableThemeButton();
        }

        function loadHalloweenTheme() {
            const storedValue = localStorage.getItem('aguGamesHalloween');
            if (storedValue === null) {
                localStorage.setItem('aguGamesHalloween', JSON.stringify(false));
                applyHalloweenTheme(false);
                return;
            }

            try {
                applyHalloweenTheme(JSON.parse(storedValue));
            } catch (error) {
                localStorage.setItem('aguGamesHalloween', JSON.stringify(false));
                applyHalloweenTheme(false);
            }
        }

        function loadCustomBackground() {
            const saved = localStorage.getItem('aguGamesCustomBg');
            if (saved && String(saved).trim()) {
                applyBackgroundImage(saved);
                updateDisableThemeButton();
                return;
            }

            localStorage.removeItem('aguGamesCustomBg');
            applyBackgroundImage('');
            updateDisableThemeButton();
        }

        function syncBackgroundState() {
            applyBackgroundBlur();
            loadCustomBackground();
        }

        function toggleHalloweenTheme() {
            const next = !document.body.classList.contains('halloween');
            applyHalloweenTheme(next);
        }

        function initializeHalloweenSecret() {
            let typed = '';
            const trigger = 'halloween';

            document.addEventListener('keydown', (event) => {
                const key = event.key.toLowerCase();
                if (!key || key.length !== 1 && key !== 'backspace') return;

                if (key === trigger[typed.length]) {
                    typed += key;
                    if (typed === trigger) {
                        toggleHalloweenTheme();
                        typed = '';
                    }
                } else {
                    typed = key === trigger[0] ? key : '';
                }
            });

            const logo = document.querySelector('.logo');
            if (logo) {
                logo.addEventListener('click', () => {
                    toggleHalloweenTheme();
                });
            }
        }

        function handleBackgroundUpload(event) {
            const [file] = event.target.files || [];
            if (!file || !file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = () => {
                const result = String(reader.result || '');
                localStorage.setItem('aguGamesCustomBg', result);
                applyBackgroundImage(result);
                updateDisableThemeButton();
            };
            reader.readAsDataURL(file);
        }

        function normalizeFaviconInput(raw) {
            const value = String(raw || '').trim();
            if (!value) return '';

            if (/^https?:\/\//i.test(value)) {
                return value;
            }

            if (/^[a-z0-9.-]+\.[a-z]{2,}(?::\d+)?(?:\/.*)?$/i.test(value)) {
                return `https://${value}`;
            }

            return value;
        }

        function resolveFaviconUrl(raw) {
            const value = normalizeFaviconInput(raw);
            if (!value) return '';

            try {
                const url = new URL(value);
                const isLikelyImage = /\.(png|jpe?g|gif|svg|ico|webp|bmp)(\?.*)?$/i.test(url.pathname);
                if (isLikelyImage || /(?:favicon|icon)/i.test(url.pathname)) {
                    return url.href;
                }

                if (url.protocol === 'http:' || url.protocol === 'https:') {
                    return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(url.hostname)}&sz=128`;
                }
            } catch {
                return value;
            }

            return value;
        }

        function setFavicon(url) {
            const clean = String(url || '').trim();
            const existing = document.querySelector("link[rel='icon'], link[rel='shortcut icon']");
            if (existing) existing.remove();

            if (!clean) return;

            const resolved = resolveFaviconUrl(clean);
            if (!resolved) return;

            const link = document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/x-icon';
            link.href = resolved;
            link.setAttribute('href', resolved);
            document.head.appendChild(link);
        }

        function applySiteSettings() {
            const title = siteTitleInput.value.trim() || 'AGU Games';
            document.title = title;
            localStorage.setItem('aguGamesTitle', title);

            const favicon = faviconInput.value.trim();
            setFavicon(favicon);
            localStorage.setItem('aguGamesFavicon', favicon);
        }

        function loadSiteSettings() {
            const savedTitle = localStorage.getItem('aguGamesTitle');
            const savedFavicon = localStorage.getItem('aguGamesFavicon');

            siteTitleInput.value = savedTitle || 'AGU Games';
            faviconInput.value = savedFavicon || '';
            applySiteSettings();
        }

        const zonesurls = [
            'https://raw.githubusercontent.com/gn-math/assets/main/zones.json',
            'https://raw.githubusercontent.com/gn-math/assets/master/zones.json',
            'https://cdn.jsdelivr.net/gh/gn-math/assets@main/zones.json'
        ];

        const fallbackGames = [
            { id: 1, name: 'Mini Racer', cover: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80', url: 'https://example.com', featured: true, special: ['arcade'] },
            { id: 2, name: 'Math Sprint', cover: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80', url: 'https://example.com', special: ['math'] },
            { id: 3, name: 'Puzzle Match', cover: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80', url: 'https://example.com', special: ['puzzle'] },
            { id: 4, name: 'Reaction Run', cover: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80', url: 'https://example.com', special: ['arcade'] }
        ];

        const coverURL = 'https://raw.githubusercontent.com/gn-math/covers/main';
        const htmlURL = 'https://raw.githubusercontent.com/gn-math/html/main';
        let zonesURL = zonesurls[0];
        let zones = [];
        let popularityData = {};

        function normalizeZones(raw) {
            return raw.filter(zone => {
                if (!zone || typeof zone !== 'object') return false;
                const id = Number(zone.id);
                if (!Number.isFinite(id) || id < 0) return false;

                const name = String(zone.name || '');
                const blocked = /(\[!\]|COMMENTS|SUGGEST|SPONSOR|ADS?\b|PROMO)/i;
                return !blocked.test(name);
            });
        }

        function toTitleCase(str) {
            return str.replace(/\w\S*/g, text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase());
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function highlightMatch(name, query) {
            const text = String(name || '');
            const value = String(query || '').trim();
            if (!value) return escapeHtml(text);

            const regex = new RegExp(`(${escapeRegExp(value)})`, 'ig');
            return escapeHtml(text).replace(regex, '<mark>$1</mark>');
        }

        function escapeRegExp(str) {
            return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        async function fetchPopularity(duration) {
            try {
                if (!popularityData[duration]) popularityData[duration] = {};
                const response = await fetch('https://data.jsdelivr.com/v1/stats/packages/gh/%67%6e%2d%6d%61%74%68/html@main/files?period=' + duration);
                const data = await response.json();
                data.forEach(file => {
                    const match = file.name.match(/\/(\d+)\.html$/);
                    if (match) {
                        const id = parseInt(match[1], 10);
                        popularityData[duration][id] = file.hits?.total ?? 0;
                    }
                });
            } catch (error) {
                if (!popularityData[duration]) popularityData[duration] = {};
                popularityData[duration][0] = 0;
            }
        }

        function makeAssetURL(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            return path.replace('{COVER_URL}', coverURL).replace('{HTML_URL}', htmlURL);
        }

        function sanitizeGameHTML(rawHtml) {
            if (!rawHtml || typeof rawHtml !== 'string') return rawHtml;

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawHtml, 'text/html');

                const blockedSelectors = [
                    '#sidebarad1',
                    '#sidebarad2',
                    '.sidebar-close',
                    '[id*="ad"]',
                    '[class*="ad"]',
                    '[class*="ads"]',
                    'iframe[src*="doubleclick"]',
                    'iframe[src*="googlesyndication"]',
                    'iframe[src*="securepubads"]',
                    'script[src*="googletagmanager"]',
                    'script[src*="google-analytics"]',
                    'script[src*="googlesyndication"]',
                    'script[src*="doubleclick"]',
                    'script[src*="adsystem"]',
                    'script[src*="adservice"]',
                    'script[src*="googleservices"]',
                    'script[src*="securepubads"]',
                    'script[src*="cloak"]',
                    'script[src*="mae"]',
                    'script[src*="analytics"]',
                    'link[href*="googlesyndication"]',
                    'link[href*="doubleclick"]',
                    'link[href*="ads"]'
                ];

                blockedSelectors.forEach(selector => {
                    doc.querySelectorAll(selector).forEach(node => node.remove());
                });

                doc.querySelectorAll('script').forEach(script => {
                    const src = (script.getAttribute('src') || '').toLowerCase();
                    const text = (script.textContent || '').toLowerCase();
                    if (
                        src.includes('googletagmanager') ||
                        src.includes('googlesyndication') ||
                        src.includes('doubleclick') ||
                        src.includes('google-analytics') ||
                        src.includes('adsbygoogle') ||
                        src.includes('adservice') ||
                        src.includes('adsystem') ||
                        src.includes('googleadservices') ||
                        src.includes('securepubads') ||
                        src.includes('cloak') ||
                        src.includes('mae') ||
                        src.includes('analytics') ||
                        text.includes('sidebarad') ||
                        text.includes('sidebar-close') ||
                        text.includes('googletagmanager') ||
                        text.includes('google-analytics') ||
                        text.includes('gtag(') ||
                        text.includes('datalayer') ||
                        text.includes('adsbygoogle') ||
                        text.includes('googlesyndication') ||
                        text.includes('doubleclick') ||
                        text.includes('securepubads') ||
                        text.includes('maeexportapis_') ||
                        text.includes('cloak') ||
                        text.includes('window.parent.mae')
                    ) {
                        script.remove();
                    }
                });

                doc.querySelectorAll('style').forEach(style => {
                    const css = (style.textContent || '').toLowerCase();
                    if (
                        css.includes('sidebarad') ||
                        css.includes('googletagmanager') ||
                        css.includes('googlesyndication') ||
                        css.includes('doubleclick') ||
                        css.includes('google-analytics') ||
                        css.includes('adsbygoogle') ||
                        css.includes('securepubads') ||
                        css.includes('cloak') ||
                        css.includes('maeexportapis') ||
                        css.includes('adslot') ||
                        css.includes('ad-wrap')
                    ) {
                        style.remove();
                    }
                });

                return doc.documentElement.outerHTML;
            } catch (error) {
                console.warn('Game HTML sanitization failed, falling back to raw HTML.', error);
                return rawHtml;
            }
        }

        function attachCoverFallback(img, item) {
            img.onerror = () => {
                if (img.src !== location.origin + '/' + FALLBACK_IMAGE && img.src !== location.origin + FALLBACK_IMAGE && img.currentSrc !== location.origin + '/' + FALLBACK_IMAGE && img.currentSrc !== FALLBACK_IMAGE) {
                    img.src = FALLBACK_IMAGE;
                    img.onerror = null;
                    return;
                }

                if (item) item.classList.add('missing');
                img.style.display = 'none';
            };
        }

        function displayFeaturedZones(featuredZones) {
            if (!featuredContainer) return;
            featuredContainer.innerHTML = '';
            if (!featuredZones.length) {
                featuredContainer.textContent = '';
                return;
            }

            featuredZones.forEach(file => {
                const item = document.createElement('div');
                item.className = 'zone-item';
                item.tabIndex = 0;
                item.dataset.zoneId = String(file.id);
                item.style.pointerEvents = 'auto';

                const img = document.createElement('img');
                img.src = makeAssetURL(file.cover);
                img.alt = file.name;
                img.loading = 'lazy';
                img.decoding = 'async';
                attachCoverFallback(img, item);

                const button = document.createElement('button');
                button.textContent = file.name;
                button.type = 'button';
                button.dataset.zoneId = String(file.id);

                item.appendChild(img);
                item.appendChild(button);
                featuredContainer.appendChild(item);
            });
        }

        function displayZones(list) {
            container.innerHTML = '';
            const query = searchBar.value.trim();
            list.forEach(file => {
                const item = document.createElement('div');
                item.className = 'zone-item';
                item.tabIndex = 0;
                item.dataset.zoneId = String(file.id);
                item.style.pointerEvents = 'auto';

                const img = document.createElement('img');
                img.src = makeAssetURL(file.cover);
                img.alt = file.name;
                img.loading = 'lazy';
                img.decoding = 'async';
                attachCoverFallback(img, item);

                const button = document.createElement('button');
                button.type = 'button';
                button.dataset.zoneId = String(file.id);
                button.innerHTML = highlightMatch(file.name, query);

                item.appendChild(img);
                item.appendChild(button);
                container.appendChild(item);
            });

            if (!list.length) {
                container.textContent = 'No games found.';
                return;
            }

            const moreButton = document.createElement('button');
            moreButton.type = 'button';
            moreButton.textContent = 'Load more';
            moreButton.className = 'load-more';
            moreButton.style.border = '1px solid var(--line)';
            moreButton.style.background = 'var(--panel)';
            moreButton.style.color = 'var(--fg)';
            moreButton.style.padding = '10px 12px';
            moreButton.style.cursor = 'pointer';
            moreButton.style.marginTop = '10px';
            moreButton.onclick = () => {
                visibleCount += INITIAL_VISIBLE_GAMES;
                renderVisibleZones(renderList);
            };

            if (renderList.length > list.length) {
                container.appendChild(moreButton);
            }
        }

        function renderVisibleZones(list) {
            renderList = list;
            const visible = list.slice(0, visibleCount || INITIAL_VISIBLE_GAMES);
            displayZones(visible);
        }

        function refreshFeaturedVisibility() {
            const query = searchBar.value.trim();
            const activeFilter = filterOptions.value !== 'none';
            if (featuredZonesWrapper) {
                featuredZonesWrapper.style.display = query || activeFilter ? 'none' : 'block';
            }
        }

        function sortZones() {
            const sortBy = sortOptions.value;
            if (sortBy === 'name') {
                zones.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'id') {
                zones.sort((a, b) => a.id - b.id);
            } else if (sortBy === 'popular') {
                zones.sort((a, b) => ((popularityData.year?.[b.id]) ?? 0) - ((popularityData.year?.[a.id]) ?? 0));
            } else if (sortBy === 'trendingMonth') {
                zones.sort((a, b) => ((popularityData.month?.[b.id]) ?? 0) - ((popularityData.month?.[a.id]) ?? 0));
            } else if (sortBy === 'trendingWeek') {
                zones.sort((a, b) => ((popularityData.week?.[b.id]) ?? 0) - ((popularityData.week?.[a.id]) ?? 0));
            } else if (sortBy === 'trendingDay') {
                zones.sort((a, b) => ((popularityData.day?.[b.id]) ?? 0) - ((popularityData.day?.[a.id]) ?? 0));
            }

            const featured = zones.filter(z => z.featured);
            if (featuredContainer) {
                displayFeaturedZones(featured);
            }
            visibleCount = INITIAL_VISIBLE_GAMES;
            renderVisibleZones(zones);
            refreshFeaturedVisibility();
        }

        function filterZones() {
            const query = searchBar.value.trim().toLowerCase();
            const filtered = query ? zones.filter(zone => zone.name.toLowerCase().includes(query)) : zones;
            visibleCount = INITIAL_VISIBLE_GAMES;
            renderVisibleZones(filtered);
            refreshFeaturedVisibility();
        }

        function filterZones2() {
            const query = filterOptions.value;
            const filtered = query === 'none' ? zones : zones.filter(zone => zone.special?.includes(query));
            visibleCount = INITIAL_VISIBLE_GAMES;
            renderVisibleZones(filtered);
            refreshFeaturedVisibility();
        }

        async function listZones() {
            let lastError = null;

            for (const candidate of zonesurls) {
                try {
                    const response = await fetch(candidate + '?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);

                    const json = await response.json();
                    if (!Array.isArray(json) || !json.length) throw new Error('Empty game list');

                    zonesURL = candidate;
                    zones = normalizeZones(json);
                    if (!zones.length) throw new Error('No valid games found');
                    zones[0].featured = true;

                    setTimeout(() => {
                        Promise.allSettled([
                            fetchPopularity('year'),
                            fetchPopularity('month'),
                            fetchPopularity('week'),
                            fetchPopularity('day')
                        ]);
                    }, 250);

                    const tags = [...new Set(zones.flatMap(zone => Array.isArray(zone.special) ? zone.special : []))];
                    filterOptions.innerHTML = '<option value="none">All tags</option>';
                    tags.forEach(tag => {
                        const opt = document.createElement('option');
                        opt.value = tag;
                        opt.textContent = toTitleCase(tag);
                        filterOptions.appendChild(opt);
                    });

                    sortZones();
                    return;
                } catch (error) {
                    lastError = error;
                    console.warn('Catalog fetch failed for', candidate, error);
                }
            }

            console.error('All catalog sources failed:', lastError);
            zones = normalizeZones(fallbackGames);
            if (!zones.length) {
                container.textContent = 'Error loading games.';
                return;
            }
            zones[0].featured = true;
            filterOptions.innerHTML = '<option value="none">All tags</option>';
            const tags = [...new Set(zones.flatMap(zone => Array.isArray(zone.special) ? zone.special : []))];
            tags.forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.textContent = toTitleCase(tag);
                filterOptions.appendChild(opt);
            });
            sortZones();
        }

        function resetZoneFrame() {
            if (zoneLoadTimeout) {
                clearTimeout(zoneLoadTimeout);
                zoneLoadTimeout = null;
            }
            if (!zoneFrame || !zoneFrame.isConnected) return;

            const parent = zoneFrame.parentNode;
            const replacement = document.createElement('iframe');
            replacement.id = 'zoneFrame';
            replacement.setAttribute('allowfullscreen', 'true');
            replacement.setAttribute('allow', 'fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture');
            replacement.style.width = '100%';
            replacement.style.height = '100%';
            replacement.style.border = '0';
            replacement.style.background = 'var(--bg)';

            parent.replaceChild(replacement, zoneFrame);
            zoneFrame = replacement;
        }

        let zoneLoadTimeout = null;

        function openZone(file) {
            const url = makeAssetURL(file.url);

            if (file.url && file.url.startsWith('http')) {
                resetZoneFrame();
                window.open(file.url, '_blank', 'noopener');
                return;
            }

            resetZoneFrame();
            zoneLoadTimeout = setTimeout(() => {
                if (zoneViewer.style.display !== 'none') {
                    console.warn('Game load timed out; opening in a new tab instead.', url);
                    window.open(url, '_blank', 'noopener');
                    closeZone();
                }
            }, 15000);

            zoneFrame.onload = () => {
                if (zoneLoadTimeout) {
                    clearTimeout(zoneLoadTimeout);
                    zoneLoadTimeout = null;
                }
            };

            fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.text();
                })
                .then(html => {
                    const cleaned = sanitizeGameHTML(html);
                    const looksLikeGameOutput = cleaned && cleaned.includes('<html') && (
                        /window\.runGame|game\.js|createUnityInstance|Unity|canvas|WebGL|application|<script/i.test(cleaned)
                    );

                    if (looksLikeGameOutput) {
                        zoneFrame.srcdoc = cleaned;
                    } else {
                        zoneFrame.src = url;
                    }
                    document.getElementById('zoneName').textContent = file.name;
                    document.getElementById('zoneId').textContent = file.id;
                    document.body.classList.add('zone-open');
                    zoneViewer.style.display = 'flex';
                })
                .catch(() => {
                    resetZoneFrame();
                    if (url && url !== 'https://example.com') {
                        window.open(url, '_blank', 'noopener');
                    } else {
                        document.body.classList.remove('zone-open');
                        zoneViewer.style.display = 'none';
                        container.textContent = 'This game is unavailable, but the site is still running normally.';
                    }
                });
        }

        function closeZone() {
            resetZoneFrame();
            document.body.classList.remove('zone-open');
            zoneViewer.style.display = 'none';
        }

        function aboutBlank() {
            const id = document.getElementById('zoneId').textContent;
            const zone = zones.find(item => String(item.id) === String(id));
            if (!zone) return;
            const url = makeAssetURL(zone.url);
            fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            }).then(html => {
                const cleaned = sanitizeGameHTML(html);
                const win = window.open('about:blank', '_blank');
                if (win) {
                    win.document.open();
                    win.document.write(cleaned);
                    win.document.close();
                }
            }).catch(() => {
                window.open(url, '_blank', 'noopener');
            });
        }

        function downloadZone() {
            const id = document.getElementById('zoneId').textContent;
            const zone = zones.find(item => String(item.id) === String(id));
            if (!zone) return;
            const url = makeAssetURL(zone.url) + '?t=' + Date.now();
            fetch(url).then(r => r.text()).then(text => {
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                const href = URL.createObjectURL(blob);
                a.href = href;
                a.download = (zone.name || 'game') + '.html';
                a.click();
                URL.revokeObjectURL(href);
            });
        }

        function fullscreenZone() {
            const target = zoneFrame;
            if (!target || !target.isConnected) {
                return;
            }

            const tryFullscreen = el => {
                if (!el) return false;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                    return true;
                }
                if (el.mozRequestFullScreen) {
                    el.mozRequestFullScreen();
                    return true;
                }
                if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                    return true;
                }
                return false;
            };

            if (!tryFullscreen(target)) {
                const current = document.getElementById('zoneId').textContent;
                const zone = zones.find(item => String(item.id) === String(current));
                if (zone) {
                    const url = makeAssetURL(zone.url);
                    window.open(url, '_blank', 'noopener');
                }
            }
        }

        const openZoneFromCard = (event) => {
            const item = event.target && event.target.closest ? event.target.closest('.zone-item') : null;
            if (!item) return;
            const zoneId = Number(item.dataset.zoneId);
            const zone = zones.find(entry => Number(entry.id) === zoneId);
            if (!zone) return;
            if (event.target && event.target.closest && event.target.closest('button')) {
                event.stopPropagation();
            }
            openZone(zone);
        };

        const bindCardInteraction = (root) => {
            if (!root) return;
            root.addEventListener('click', openZoneFromCard);
            root.addEventListener('pointerup', openZoneFromCard);
            root.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const target = event.target && event.target.closest ? event.target.closest('.zone-item') : null;
                if (!target) return;
                event.preventDefault();
                const zoneId = Number(target.dataset.zoneId);
                const zone = zones.find(entry => Number(entry.id) === zoneId);
                if (zone) openZone(zone);
            });
        };

        bindCardInteraction(container);
        if (featuredContainer) {
            bindCardInteraction(featuredContainer);
        }

        searchBar.addEventListener('input', filterZones);
        sortOptions.addEventListener('change', sortZones);
        filterOptions.addEventListener('change', filterZones2);
        siteTitleInput.addEventListener('input', applySiteSettings);
        faviconInput.addEventListener('input', applySiteSettings);
        if (bgImageInput) {
            bgImageInput.addEventListener('change', (event) => {
                handleBackgroundUpload(event);
                updateDisableThemeButton();
            });
        }
        if (bgBlurInput) {
            bgBlurInput.addEventListener('input', (event) => {
                const value = Number.parseFloat(event.target.value);
                applyBackgroundBlur(value);
            });
        }
        if (disableThemeButton) {
            disableThemeButton.addEventListener('click', disableImageTheme);
        }

        bindPaletteInputs();
        loadPalette();
        loadHalloweenTheme();
        syncBackgroundState();
        loadSiteSettings();
        initializeHalloweenSecret();
        updateDisableThemeButton();
        listZones();
    </script>
</body>
</html>
